<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KidsFlow — E-mail confirmado</title>

  <style>
    :root {
      --background: #f7f8f7;
      --surface: #ffffff;
      --text: #17201e;
      --secondary: #5f6b67;
      --border: #dde3e0;
      --primary: #0f766e;
      --primary-soft: #ddf5f1;
      --danger: #b42318;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    main {
      width: 100%;
      max-width: 480px;
      padding: 36px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      text-align: center;
    }

    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: var(--primary);
      color: white;
      font-size: 24px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: var(--secondary);
      font-size: 16px;
      line-height: 1.6;
    }

    .error h1 {
      color: var(--danger);
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <main id="success">
    <div class="mark">K</div>

    <h1>E-mail confirmado</h1>

    <p>
      Seu endereço de e-mail foi confirmado com sucesso.
      Você já pode voltar ao KidsFlow e entrar na sua conta.
    </p>
  </main>

  <main id="error" class="error hidden">
    <div class="mark">K</div>

    <h1>Não foi possível confirmar o e-mail</h1>

    <p>
      O link pode ter expirado ou já ter sido utilizado.
      Volte ao KidsFlow e tente novamente.
    </p>
  </main>

  <script>
    const query = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.substring(1));

    const error =
      query.get("error") ||
      query.get("error_code") ||
      hash.get("error") ||
      hash.get("error_code");

    if (error) {
      document.getElementById("success").classList.add("hidden");
      document.getElementById("error").classList.remove("hidden");
    }
  </script>
</body>
</html>
