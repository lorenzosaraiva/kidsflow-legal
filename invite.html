<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Convite KidsFlow</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        align-items: center;
        background: #f7f8f7;
        color: #17201e;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }
      main {
        max-width: 440px;
        width: 100%;
      }
      h1 {
        color: #0f766e;
        font-size: 20px;
        margin: 0 0 32px;
      }
      h2 {
        font-size: 28px;
        line-height: 1.2;
        margin: 0 0 12px;
      }
      p {
        line-height: 1.5;
        margin: 0 0 20px;
      }
      a {
        align-items: center;
        background: #0f766e;
        border-radius: 12px;
        color: #fff;
        display: flex;
        font-weight: 600;
        justify-content: center;
        min-height: 52px;
        padding: 0 20px;
        text-decoration: none;
      }
      section {
        border-top: 1px solid #dde3e0;
        margin-top: 32px;
        padding-top: 24px;
      }
      .invalid {
        color: #b42318;
      }
      [hidden] {
        display: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1413;
          color: #f5f7f6;
        }
        h1 {
          color: #5eead4;
        }
        a {
          background: #5eead4;
          color: #062c29;
        }
        section {
          border-color: #2b3532;
        }
        .invalid {
          color: #f87171;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>KidsFlow</h1>
      <div id="invitation" hidden>
        <h2>Você recebeu um convite</h2>
        <p>Abra o KidsFlow para entrar no núcleo familiar.</p>
        <a id="open-app" href="#">Abrir KidsFlow</a>
        <section>
          <strong>Ainda não tem o KidsFlow?</strong>
          <p>
            Durante o período de testes, instale o aplicativo pelo convite do TestFlight (iPhone)
            ou pelo teste do Google Play (Android).
          </p>
        </section>
      </div>
      <div id="invalid" hidden>
        <h2>Convite indisponível</h2>
        <p class="invalid">Este convite é inválido.</p>
      </div>
    </main>
    <script>
      (() => {
        const parameters = new URLSearchParams(window.location.hash.slice(1));
        const token = parameters.get("token");
        const validToken = typeof token === "string" && /^[A-Za-z0-9_-]{20,512}$/.test(token);
        const invitation = document.getElementById("invitation");
        const invalid = document.getElementById("invalid");
        const openApp = document.getElementById("open-app");
        if (!validToken) {
          invalid.hidden = false;
          return;
        }
        openApp.href = `kidsflow://invite?token=${encodeURIComponent(token)}`;
        window.history.replaceState(null, "", `${window.location.pathname}${window.location.search}`);
        invitation.hidden = false;
      })();
    </script>
  </body>
</html>
